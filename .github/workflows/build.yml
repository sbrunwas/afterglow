name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP, sequencer and state tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 in pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $validator = (Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          & $validator --strictness-level 5 --skip-gui-tests --validate "$PWD/build/Afterglow_artefacts/Release/VST3/Afterglow.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          & build/Release/ag_render_demo.exe dist/Afterglow-909-808-Demo.wav dist/Afterglow-Demo-Stats.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse build/Afterglow_artefacts/Release/VST3/Afterglow.vst3 dist/
          Copy-Item build/Afterglow_artefacts/Release/Standalone/Afterglow.exe dist/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/
          Copy-Item scripts/install-windows.ps1 dist/
          Copy-Item -Recurse docs dist/
          New-Item -ItemType Directory -Force dist/licenses
          Copy-Item Source/third_party/DaisySP/LICENSE dist/licenses/DaisySP-LICENSE.txt
          Copy-Item Source/third_party/Schwung808/LICENSE dist/licenses/Schwung-GPL-LICENSE.txt
          Copy-Item Source/third_party/Schwung808/THIRD_PARTY.md dist/licenses/Schwung808-MIT-NOTICE.md
          Copy-Item Source/third_party/ER99/PROVENANCE.md dist/licenses/ER99-PROVENANCE.md
          Copy-Item web/dist/ENGINE-NOTES.md dist/docs/ENGINE-NOTES.md
          Copy-Item build/_deps/juce-src/LICENSE.md dist/licenses/JUCE-LICENSE.md
          git archive --format=zip --output=dist/Afterglow-source.zip HEAD
          git -C build/_deps/juce-src archive --format=zip --output="$PWD/dist/JUCE-8.0.6-source.zip" HEAD
          Compress-Archive -Path dist/* -DestinationPath Afterglow-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Afterglow-Windows-x64
          path: Afterglow-Windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" Afterglow-Windows-x64.zip dist/Afterglow-909-808-Demo.wav docs/images/afterglow-editor.png --clobber
          } else {
            gh release create "$env:RELEASE_TAG" Afterglow-Windows-x64.zip dist/Afterglow-909-808-Demo.wav docs/images/afterglow-editor.png --target "$env:RELEASE_COMMIT" --title "Afterglow $env:RELEASE_TAG — Windows development preview" --notes-file docs/RELEASE.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DAFTERGLOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
