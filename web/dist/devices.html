<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClawStudio Rack Instruments · Prototype 0.1</title><link rel="stylesheet" href="./rack-devices.css"><link rel="stylesheet" href="./poly-modular.css"><style>body{margin:0;padding:10px;background:#0c1117;color:#ebefe9;font:13px system-ui}.outer{max-width:1480px;margin:auto}.apphead{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:10px 4px}.apphead h1{font-size:20px;margin:0}.apphead small{color:#9eaeac}.tabs{display:flex;gap:5px}.tabs button{padding:10px 14px;background:#243642;color:#cfddd2;border:1px solid #5c7980;border-radius:4px;font-weight:800}.tabs button.on{background:#b5dbc3;color:#0a261f}.instrument{display:none}.instrument.on{display:block}footer{margin-top:12px;padding:12px;font-size:11px;color:#93a79f}</style></head><body><div class="outer"><div class="apphead"><h1>CLAWSTUDIO <small>INSTRUMENT LAB · THREE NEW RACKS</small></h1><div class="tabs"><button data-tab="poly" class="on">POLY-01 / JP</button><button data-tab="texture">TEXTURE-01 / μQ</button><button data-tab="acid">ACID-01 / 303</button></div></div><div class="instrument on" id="poly"></div><div class="instrument" id="texture"></div><div class="instrument" id="acid"></div><footer>Hardware-inspired originals · JE-8086, Vavra and Open303 are separate native research references, not embedded firmware emulations. Audio runs locally via Web Audio.</footer></div><script type="module">import {createRackInstrument} from './rack-devices.js';for(const type of ['poly','texture','acid'])createRackInstrument(document.getElementById(type),type);document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===btn));document.querySelectorAll('.instrument').forEach(x=>x.classList.toggle('on',x.id===btn.dataset.tab))});</script></body></html>
